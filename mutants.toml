# mutants.toml

# Per-mutant test timeout in seconds. Soroban tests are fast; 60 s is generous.
timeout = 60

# Source files included in the mutation scope.
# All modules handling funds, balances, state transitions, governance, and economic rules.
include_globs = [
    "src/lib.rs",
    "src/vouch.rs",
    "src/governance.rs",
    "src/admin.rs",
    "src/helpers.rs",
    "src/credit_score.rs",
    "src/flash_loan.rs",
    "src/insurance.rs",
    "src/dynamic_interest.rs",
    "src/collateral_pool.rs",
    "src/community_treasury.rs",
    "src/loan.rs",
    "src/loan_acceleration.rs",
    "src/loan_attribution.rs",
    "src/loan_cart.rs",
    "src/loan_priority.rs",
    "src/loan_tokenization.rs",
    "src/liquidity_farming.rs",
    "src/liquidity_mining.rs",
    "src/bond_protection.rs",
    "src/bridge.rs",
    "src/circuit_breaker.rs",
    "src/cross_chain.rs",
    "src/cross_chain_auction.rs",
    "src/cross_chain_governance.rs",
    "src/guarantor.rs",
    "src/interest_rate_options.rs",
    "src/large_loan_approval.rs",
    "src/lazy_slash.rs",
    "src/lazy_default_detection.rs",
    "src/batch_transfer.rs",
    "src/reputation.rs",
    "src/reputation_nft.rs",
    "src/syndication.rs",
    "src/vouch_milestones.rs",
    "src/vouch_reputation.rs",
    "src/vouch_syndication.rs",
    "src/arbitrage_prevention.rs",
    "src/recurring_payment.rs",
    "src/multitoken_support.rs",
    "src/covenant_monitoring.rs",
    "src/governance_token.rs",
    "src/prediction_market.rs",
    "src/pool_composability.rs",
    "src/cooldown_bypass.rs",
    "src/diversification.rs",
    "src/maturity.rs",
    "src/loyalty.rs",
    "src/rbac.rs",
]

# Exclude test modules, test harnesses, simulation harnesses, and pure type/error definitions.
exclude_globs = [
    "src/*_test.rs",
    "src/tests/**",
    "src/tests.rs",
    "src/differential_testing.rs",
    "src/fuzz_stake_testing.rs",
    "src/gas_cost_regression.rs",
    "src/economic_simulation.rs",
    "src/governance_proposal_testing.rs",
    "src/cross_chain_test_scenarios.rs",
    "src/regression_tests.rs",
    "src/synthetic_monitoring.rs",
    "src/detection.rs",
    "src/types.rs",
    "src/errors.rs",
    "src/cache.rs",
    "src/tracing.rs",
    "src/audit.rs",
    "src/audit_verification.rs",
    "src/feature_flags.rs",
    "src/social.rs",
    "src/merkle_tree.rs",
    "src/zk_snarks.rs",
    "src/invariants.rs",
    "build.rs",
]

# Functions to skip (e.g. trivial getters, pure logging).
# Add entries here when a surviving mutant is accepted as low-risk.
# Example:
# [[exclude_functions]]
# name = "get_version"
# reason = "Version string is cosmetic; no test coverage required."

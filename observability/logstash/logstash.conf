# Issue #1578: Logstash Configuration
# Log processing and parsing pipeline

input {
  # Receive logs from applications via syslog
  tcp {
    port => 5000
    codec => json
    type => "app-log"
  }

  # Receive logs via UDP
  udp {
    port => 5000
    codec => json
    type => "app-log"
  }

  # Read from files (for container logs mounted as volumes)
  file {
    path => "/var/log/app/**/*.log"
    start_position => "beginning"
    type => "file-log"
  }
}

filter {
  # Parse JSON logs
  if [type] == "app-log" {
    json {
      source => "message"
      target => "parsed_log"
    }

    # Extract fields from parsed logs
    mutate {
      add_field => {
        "service" => "%{[parsed_log][service]}"
        "level" => "%{[parsed_log][level]}"
        "trace_id" => "%{[parsed_log][trace_id]}"
        "span_id" => "%{[parsed_log][span_id]}"
        "user_id" => "%{[parsed_log][user_id]}"
      }
      remove_field => ["message", "parsed_log"]
    }

    # Parse timestamps
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Parse log levels
    if [level] == "ERROR" or [level] == "error" {
      mutate {
        add_field => { "log_level" => "error" }
      }
    } else if [level] == "WARN" or [level] == "warn" {
      mutate {
        add_field => { "log_level" => "warning" }
      }
    } else {
      mutate {
        add_field => { "log_level" => "info" }
      }
    }

    # Add metadata
    mutate {
      add_field => {
        "environment" => "${ENVIRONMENT:staging}"
        "version" => "${APP_VERSION:unknown}"
      }
    }
  }

  # Parse file logs
  if [type] == "file-log" {
    # Extract service name from path
    mutate {
      add_field => { "service" => "%{[host][name]}" }
    }

    # Parse common log formats (nginx, docker, etc)
    grok {
      match => [
        "message",
        "%{COMBINEDAPACHELOG}",
        "%{SYSLOGLINE}",
        "%{LOGLEVEL:log_level}\s+\[%{DATA:thread}\]\s+%{DATA:class}\s*-\s*%{GREEDYDATA:message}"
      ]
    }

    # Extract timestamp from various formats
    date {
      match => [
        "timestamp",
        "dd/MMM/yyyy:HH:mm:ss Z",
        "ISO8601",
        "UNIX"
      ]
      target => "@timestamp"
    }
  }

  # Enrich logs with geographical data
  geoip {
    source => "clientip"
    target => "geoip"
  }

  # Add tags based on content
  if [message] =~ /ERROR|Exception|panic|fatal/ {
    mutate {
      add_tag => ["error"]
    }
  }

  if [message] =~ /security|auth|unauthorized|forbidden/ {
    mutate {
      add_tag => ["security"]
    }
  }

  if [message] =~ /performance|latency|timeout|slow/ {
    mutate {
      add_tag => ["performance"]
    }
  }
}

output {
  # Send all logs to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    retry_on_conflict => 2
  }

  # Send errors to separate index for quick access
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Send security-related logs to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "security-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Print errors to stdout for debugging
  if "error" in [tags] {
    stdout {
      codec => rubydebug
    }
  }

  # Send metrics to Prometheus
  if [type] == "app-log" and [metric] {
    http {
      url => "http://pushgateway:9091/metrics/job/logstash/instance/%{hostname}"
      http_method => "post"
      format => "message"
      message => '%{message}'
    }
  }
}

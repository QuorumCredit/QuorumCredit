[workspace]
members = ["tools/indexer"]
resolver = "2"

[package]
name = "quorum_credit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
mainnet-tests = []

[dependencies]
soroban-sdk = { version = "26.0.0", features = ["alloc"] }
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "26.0.0", features = ["testutils"] }
ed25519-dalek = "2.2"
proptest = { version = "1.4", default-features = false, features = ["std"] }

[[test]]
name = "api_integration"
path = "tests/api_integration.rs"

[[test]]
name = "compliance_validation"
path = "tests/compliance_validation.rs"

[[test]]
name = "gas_cost_regression"
path = "tests/gas_cost_regression.rs"

[profile.coverage]
inherits = "test"


[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

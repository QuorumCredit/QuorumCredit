name: Gas Budget Benchmarks

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/benchmarks.json"
      - "docs/gas_trends.json"
      - "tools/benchmark_analyzer.py"
      - "tools/gas_optimizer.py"
      - ".github/workflows/gas-benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/benchmarks.json"
      - "docs/gas_trends.json"
      - "tools/benchmark_analyzer.py"
      - "tools/gas_optimizer.py"
      - ".github/workflows/gas-benchmarks.yml"

jobs:
  gas-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run parameterized gas benchmarks
        run: |
          cargo test --lib gas_benchmark -- --nocapture 2>&1 | tee benchmark_output.txt
        continue-on-error: true

      - name: Extract and parse benchmark measurements
        run: |
          python3 tools/benchmark_analyzer.py docs/benchmarks.json
        continue-on-error: true

      - name: Profile gas usage per contract operation
        run: |
          python3 tools/gas_optimizer.py profile \
            --input benchmark_output.txt \
            --output docs/gas_profile.json
        continue-on-error: true

      - name: Generate optimization suggestions
        run: |
          python3 tools/gas_optimizer.py suggest \
            --profile docs/gas_profile.json \
            --output docs/gas_suggestions.md
        continue-on-error: true

      - name: Compare against benchmark baseline
        run: |
          python3 tools/gas_optimizer.py compare \
            --profile docs/gas_profile.json \
            --baseline docs/benchmarks.json \
            --output docs/gas_comparison.md
        continue-on-error: true

      - name: Track gas cost trends over time
        run: |
          python3 tools/gas_optimizer.py trend \
            --profile docs/gas_profile.json \
            --history docs/gas_trends.json
        continue-on-error: true

      - name: Comment PR with complexity analysis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const benchmarkOutput = fs.existsSync('benchmark_output.txt')
              ? fs.readFileSync('benchmark_output.txt', 'utf8')
              : '';

            const complexityMatches = benchmarkOutput.match(/Fitted complexity: (\S+)/g) || [];
            const operations = [];

            for (const match of complexityMatches) {
              const complexity = match.split(': ')[1];
              operations.push(`- ${complexity}`);
            }

            const suggestions = fs.existsSync('docs/gas_suggestions.md')
              ? fs.readFileSync('docs/gas_suggestions.md', 'utf8')
              : '_No optimization suggestions available._';

            const comparison = fs.existsSync('docs/gas_comparison.md')
              ? fs.readFileSync('docs/gas_comparison.md', 'utf8')
              : '_No benchmark comparison available._';

            const comment = [
              '## Gas Budget Complexity Analysis',
              '',
              operations.length > 0
                ? `Detected complexity classes:\n${operations.join('\n')}`
                : 'Running complexity analysis...',
              '',
              '### Optimization Suggestions',
              '',
              suggestions,
              '',
              '### Benchmark Comparison',
              '',
              comparison,
              '',
              '[View full report](benchmark_report.html) (attached to this run)'
            ].join('\n');

            // PRs from forks get a read-only GITHUB_TOKEN, so this call is
            // expected to 403 there — don't fail the job over a best-effort comment.
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (err) {
              core.warning(`Could not post benchmark comment: ${err.message}`);
            }

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            docs/benchmark_report.html
            docs/gas_profile.json
            docs/gas_suggestions.md
            docs/gas_comparison.md
          retention-days: 30

      - name: Restore last merged gas baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gas-baseline
          path: .gas-baseline

      - name: Enforce gas regression threshold
        env:
          GAS_REGRESSION_THRESHOLD_BPS: "500"
        run: |
          set -euo pipefail

          THRESHOLD_BPS="${GAS_REGRESSION_THRESHOLD_BPS:-500}"
          BASELINE_FILE="docs/benchmarks.json"
          PREVIOUS_BASELINE=".gas-baseline/benchmarks.json"

          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::No $BASELINE_FILE found; skipping gas regression gate."
            exit 0
          fi

          if [ ! -f "$PREVIOUS_BASELINE" ]; then
            echo "::notice::No persisted baseline artifact found; treating this run as the initial baseline."
            exit 0
          fi

          python3 - "$PREVIOUS_BASELINE" "$BASELINE_FILE" "$THRESHOLD_BPS" <<'PY'
          import json
          import sys

          previous_path, current_path, threshold_bps = sys.argv[1], sys.argv[2], int(sys.argv[3])

          def load(path):
              with open(path, "r", encoding="utf-8") as handle:
                  return json.load(handle)

          def index(entries):
              result = {}
              for entry in entries:
                  name = entry.get("operation") or entry.get("name")
                  if name is not None:
                      result[name] = entry
              return result

          previous = index(load(previous_path))
          current = index(load(current_path))

          regressions = []
          for name, entry in current.items():
              if entry.get("regression_detected") is not True:
                  continue
              bps = entry.get("regression_percentage_bps")
              if bps is None:
                  bps = 0
              if bps > threshold_bps:
                  regressions.append((name, bps))

          if regressions:
              for name, bps in regressions:
                  print(f"::error::Gas regression for '{name}': {bps} bps exceeds threshold {threshold_bps} bps")
              sys.exit(1)

          print(f"No gas regression beyond {threshold_bps} bps detected.")
          PY

      - name: Upload gas baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gas-baseline
          path: docs/benchmarks.json
          retention-days: 90

      - name: Check for regression (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 tools/benchmark_analyzer.py docs/benchmarks.json
          python3 tools/gas_optimizer.py trend \
            --profile docs/gas_profile.json \
            --history docs/gas_trends.json
          echo "✓ Benchmark baseline updated"

name: Generate API Clients

on:
  push:
    branches:
      - main
    paths:
      - "openapi.yaml"
      - "scripts/generate-clients.ts"
      - ".github/workflows/generate-clients.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "server/package-lock.json"

      - name: Install dependencies
        run: cd server && npm ci

      - name: Generate clients
        run: cd server && npm run generate-clients

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python client test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f generated/python-client/requirements.txt ]; then
            python -m pip install -r generated/python-client/requirements.txt
          fi

      - name: Verify Python client is not empty
        run: |
          if [ ! -d generated/python-client/quorum_credit_client ]; then
            echo "::error::generated/python-client/quorum_credit_client/ was not generated"
            exit 1
          fi
          if [ -z "$(find generated/python-client/quorum_credit_client -type f -name '*.py' -print -quit)" ]; then
            echo "::error::generated/python-client/quorum_credit_client/ contains no Python modules"
            exit 1
          fi

      - name: Run Python client smoke import test
        working-directory: generated/python-client
        run: |
          python -c 'import quorum_credit_client'
          if [ -d tests ]; then
            python -m pytest tests
          fi

      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet generated/; then
            echo "no-changes=true" >> $GITHUB_OUTPUT
          else
            echo "no-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify.outputs.no-changes == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: regenerate API clients"
          title: "chore: regenerate API clients from OpenAPI spec"
          body: |
            This PR regenerates the API clients based on changes to the OpenAPI specification.

            Please review the generated code for any breaking changes before merging.
          branch: chore/regenerate-clients
          delete-branch: true
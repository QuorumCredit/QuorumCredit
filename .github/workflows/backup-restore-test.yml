name: Backup and Restore Testing

# Proves restore capability on a schedule. Requires a distinct staging
# contract and performs an executed restore plus state comparison.

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: backup-restore-verification
  cancel-in-progress: false

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/backup.sh"
      - "scripts/restore.sh"
      - "scripts/test_backup_restore.sh"
      - "scripts/test_backup_restore_correctness.sh"
      - "scripts/test_backup_restore_policy.sh"
      - ".github/workflows/backup-restore-test.yml"

jobs:
  # The full drill needs a live testnet CONTRACT_ID/ADMIN_KEY, which GitHub
  # never exposes to pull_request-triggered runs from forks — so PRs only get
  # offline syntax and safety-policy checks; the live drill stays scheduled or manual.
  lint:
    name: Lint backup/restore scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: bash -n syntax check
        run: |
          for f in scripts/backup.sh scripts/restore.sh scripts/test_backup_restore.sh scripts/test_backup_restore_correctness.sh scripts/test_backup_restore_policy.sh; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              bash -n "$f"
            fi
          done

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Test restore safety policy
        run: ./scripts/test_backup_restore_policy.sh

  backup-restore-drill:
    name: Weekly backup/restore drill
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stellar CLI and jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq libdbus-1-dev pkg-config
          if ! command -v stellar &>/dev/null; then
            cargo install --locked stellar-cli || echo "stellar CLI install skipped/failed — drill will report accordingly"
          fi

      - name: Find previous completed drill
        id: previous
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backup-restore-test.yml',
              per_page: 100
            });
            const candidates = runs.filter(run =>
              run.id !== context.runId &&
              run.event !== 'pull_request' &&
              run.status === 'completed'
            );
            let previousRunId = '';
            for (const run of candidates) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              if (data.artifacts.some(artifact =>
                artifact.name === 'backup-verification-history' && !artifact.expired
              )) {
                previousRunId = String(run.id);
                break;
              }
            }
            core.setOutput('run_id', previousRunId);

      - name: Restore verification history
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backup-verification-history
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: backups/test-results

      - name: Run backup/restore drill
        env:
          CONTRACT_ID: ${{ secrets.BACKUP_TEST_CONTRACT_ID }}
          ADMIN_KEY: ${{ secrets.BACKUP_TEST_ADMIN_KEY }}
          NETWORK: ${{ vars.BACKUP_TEST_NETWORK || 'testnet' }}
          STAGING_CONTRACT_ID: ${{ secrets.BACKUP_TEST_STAGING_CONTRACT_ID }}
          STAGING_ADMIN_KEY: ${{ secrets.BACKUP_TEST_STAGING_ADMIN_KEY }}
          BACKUP_TEST_EXECUTE: 'true'
          BACKUP_TEST_REQUIRE_RESTORE: 'true'
        run: ./scripts/test_backup_restore.sh --network "${NETWORK}"

      - name: Upload cumulative verification history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-verification-history
          path: backups/test-results/history.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Upload backup archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-restore-drill-${{ github.run_id }}
          path: backups/backup_*.tar.gz
          retention-days: 90
          if-no-files-found: warn

      - name: Alert on verification failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'Automated backup verification failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled backup verification failed. Review the run and its artifacts: ${runUrl}\n\n<!-- backup-verification-alert -->`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Resolve verification alert after recovery
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'Automated backup verification failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Backup verification recovered successfully: ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

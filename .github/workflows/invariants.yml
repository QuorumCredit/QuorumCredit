name: Contract Invariants

on:
  pull_request:
    paths:
      - "src/vouch.rs"
      - "src/loan.rs"
      - "src/governance.rs"
      - "src/admin.rs"
      - "src/lib.rs"
      - "src/helpers.rs"
      - "src/types.rs"
      - "src/errors.rs"
      - "src/invariants_test.rs"
      - "src/differential_testing.rs"
      - "src/gas_cost_regression.rs"
      - "Cargo.toml"
      - "tests/gas_cost_regression.rs"
      - ".github/workflows/invariants.yml"
  push:
    branches: [main]
    paths:
      - "src/vouch.rs"
      - "src/loan.rs"
      - "src/governance.rs"
      - "src/admin.rs"
      - "src/lib.rs"
      - "src/helpers.rs"
      - "src/types.rs"
      - "src/errors.rs"
      - "src/invariants_test.rs"
      - "src/differential_testing.rs"
      - "src/gas_cost_regression.rs"
      - "Cargo.toml"
      - "tests/gas_cost_regression.rs"
      - ".github/workflows/invariants.yml"

jobs:
  invariants:
    name: Contract Invariant Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-invariants-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-invariants-

      - name: cargo check
        run: cargo check

      - name: cargo clippy (no warnings)
        run: cargo clippy -- -D warnings

      - name: Run invariant tests
        run: |
          cargo test invariants_test -- --nocapture 2>&1

      - name: Run negative control tests
        run: |
          cargo test negative_control -- --nocapture 2>&1

      - name: Run proptest fuzzing harness
        run: |
          cargo test prop_invariants_hold_under_random_ops -- --nocapture 2>&1
        env:
          PROPTEST_CASES: 256

      - name: Run gas cost regression tests
        run: cargo test --test gas_cost_regression

      - name: Run full test suite
        run: cargo test --lib 2>&1

name: Canary Deployment

# Issue #1231: replaces a big-bang server deploy with a progressive rollout —
# scripts/canary_deploy.sh shifts traffic in stages (5% -> 25% -> 50% -> 100%),
# monitoring the canary's error rate and latency at each stage via /metrics and
# automatically rolling back on a breach. Manual dispatch only: this repo has no
# load balancer / ingress config to trigger against automatically, so promoting
# a specific build is an operator decision (which build, which environment).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging, production)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      canary_url:
        description: "Base URL of the canary server instance (must expose /health and /metrics)"
        required: true
      stable_url:
        description: "Base URL of a stable instance for relative comparison (optional)"
        required: false
      steps:
        description: "Traffic percentages to progress through"
        required: false
        default: "5 25 50 100"
      window_seconds:
        description: "Observation window per step, in seconds"
        required: false
        default: "60"

jobs:
  lint-deploy-workflows:
    name: Lint deploy workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deploy workflows declare environment protection
        run: python3 scripts/lint_deploy_workflows.py

  canary-rollout:
    name: Progressive canary rollout
    needs: lint-deploy-workflows
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Run canary rollout
        # No --lb-adapter is wired here: this repo has no load balancer/ingress config
        # to call. Without one, canary_deploy.sh prints each traffic-weight change as an
        # operator instruction instead of applying it, while still running the real
        # metrics-based promote/rollback decision logic. Plug in a real adapter script
        # (see docs/canary-deployment-guide.md) once your target environment has one.
        env:
          CANARY_URL: ${{ inputs.canary_url }}
          STABLE_URL: ${{ inputs.stable_url }}
          STEPS: ${{ inputs.steps }}
          WINDOW_SECONDS: ${{ inputs.window_seconds }}
        run: |
          set -euo pipefail

          url_regex='^https?://[^[:space:][:cntrl:]]+$'
          if [[ ! "$CANARY_URL" =~ $url_regex ]]; then
            echo "Error: canary_url must be a valid http:// or https:// URL" >&2
            exit 1
          fi

          if [[ -n "$STABLE_URL" && ! "$STABLE_URL" =~ $url_regex ]]; then
            echo "Error: stable_url must be a valid http:// or https:// URL" >&2
            exit 1
          fi

          if [[ ! "$WINDOW_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Error: window_seconds must be a positive integer" >&2
            exit 1
          fi

          if [[ -z "${STEPS//[,[:space:]]/}" ]]; then
            echo "Error: steps must contain at least one traffic percentage" >&2
            exit 1
          fi
          IFS=', ' read -ra step_values <<< "$STEPS"
          for step in "${step_values[@]}"; do
            [[ -z "$step" ]] && continue
            if [[ ! "$step" =~ ^[0-9]+$ ]] || (( step < 1 || step > 100 )); then
              echo "Error: each step in steps must be an integer between 1 and 100 (got '$step')" >&2
              exit 1
            fi
          done

          args=(
            --canary-url "$CANARY_URL"
            --steps "$STEPS"
            --window-seconds "$WINDOW_SECONDS"
          )
          if [[ -n "$STABLE_URL" ]]; then
            args+=(--stable-url "$STABLE_URL")
          fi

          ./scripts/canary_deploy.sh "${args[@]}"

      - name: Upload canary decision history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-history-${{ github.run_id }}
          path: deploy/canary-history.jsonl
          if-no-files-found: warn

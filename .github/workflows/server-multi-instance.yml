name: Server Multi-Instance Tests

# Issue #1983: runs server/test/multi-instance (cross-instance pub/sub delivery,
# distributed lock and the Redis-backed WS aggregate rate limiter) against a real
# Redis, so horizontal-scale behavior is covered in CI.
#
# The workflow triggers on every server/** change so that the `multi-instance-gate`
# job always reports a status and can be marked as a required check. The heavy
# `multi-instance` job only runs when the ws / pubsub / multi-instance paths change.

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-multi-instance.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-multi-instance.yml'

# paths-filter lists PR files via the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect multi-instance changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'server/src/ws/**'
              - 'server/src/pubsub/**'
              - 'server/test/multi-instance/**'
              - 'server/vitest.multi-instance.config.ts'
              - 'server/package.json'
              - 'server/package-lock.json'
              - '.github/workflows/server-multi-instance.yml'

  multi-instance:
    name: Multi-instance tests (Redis)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run multi-instance tests against Redis
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:multi-instance

  multi-instance-gate:
    name: Multi-instance gate
    runs-on: ubuntu-latest
    needs: [changes, multi-instance]
    if: always()
    steps:
      - name: Require multi-instance tests for ws/pubsub changes
        run: |
          relevant="${{ needs.changes.outputs.relevant }}"
          result="${{ needs.multi-instance.result }}"
          echo "relevant=$relevant multi-instance=$result"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Change detection failed"
            exit 1
          fi
          if [ "$relevant" = "true" ] && [ "$result" != "success" ]; then
            echo "::error::Multi-instance tests are required for server/src/ws and server/src/pubsub changes and did not pass"
            exit 1
          fi

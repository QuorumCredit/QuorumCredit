name: Unwrap Budget

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/count_unwrap_expect.sh"
      - "scripts/check_unwrap_budget.sh"
      - "scripts/unwrap-budget.txt"
  pull_request:
    paths:
      - "src/**"
      - "scripts/count_unwrap_expect.sh"
      - "scripts/check_unwrap_budget.sh"
      - "scripts/unwrap-budget.txt"

jobs:
  unwrap-budget:
    name: No new unwrap/expect in contract code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check unwrap/expect budget
        run: bash scripts/check_unwrap_budget.sh

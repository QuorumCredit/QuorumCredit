name: Contract Upgrade Test Pipeline

# Automates the manual, error-prone parts of a contract upgrade:
# building pre/post-upgrade WASM, validating state migration,
# checking backward compatibility, diffing storage layouts, and
# rolling back automatically if any of those checks fail.

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/upgrade_pipeline_test.sh"
      - "tests/fixtures/upgrade/**"
      - ".github/workflows/upgrade-test.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  upgrade-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-upgrade-pipeline-${{ hashFiles('**/Cargo.lock') }}

      - name: Build pre-upgrade WASM (base branch)
        run: |
          set -euo pipefail
          git worktree add /tmp/pre-upgrade origin/main
          (cd /tmp/pre-upgrade && cargo build --release --target wasm32v1-none)
          mkdir -p artifacts
          cp /tmp/pre-upgrade/target/wasm32v1-none/release/*.wasm artifacts/pre_upgrade.wasm

      - name: Build post-upgrade WASM (this branch)
        run: |
          set -euo pipefail
          cargo build --release --target wasm32v1-none
          cp target/wasm32v1-none/release/*.wasm artifacts/post_upgrade.wasm

      - name: Run upgrade test pipeline
        id: pipeline
        run: |
          chmod +x scripts/upgrade_pipeline_test.sh
          ./scripts/upgrade_pipeline_test.sh \
            --pre-wasm artifacts/pre_upgrade.wasm \
            --post-wasm artifacts/post_upgrade.wasm \
            --fixtures tests/fixtures/upgrade

      - name: Automatic rollback on failure
        if: failure() && steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Upgrade pipeline failed validation. Rolling back."
          ./scripts/upgrade_pipeline_test.sh \
            --rollback \
            --pre-wasm artifacts/pre_upgrade.wasm \
            --fixtures tests/fixtures/upgrade
          echo "Rollback plan generated at artifacts/rollback_plan.json — apply manually against the target network before re-attempting the upgrade."
          exit 1

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-pipeline-artifacts
          path: artifacts/
          retention-days: 14
